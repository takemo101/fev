# Paths resolve relative to this YAML file.
# Start with `just demo`, then run `just demo-input` in another terminal.
settle: 200ms
concurrency: 2
state: ./demo/state

roots:
  - id: demo
    path: ./demo/work
    rules:
      # hello.txt -> hello.upper.txt
      - id: uppercase
        events: [created]
        match: '^(?P<name>[^/.]+)\.txt$'
        run: tr '[:lower:]' '[:upper:]' < "$FILE" > "$OUT_TMP"
        out: "{name}.upper.txt"

      # hello.upper.txt -> hello.done.txt
      - id: finish
        events: [created]
        match: '^(?P<name>[^/.]+)\.upper\.txt$'
        run: |
          {
            printf 'Processed: %s\n' "$KEY"
            cat "$FILE"
          } > "$OUT_TMP"
        out: "{name}.done.txt"
