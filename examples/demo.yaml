# Paths resolve relative to this YAML file.
# Start with `just demo`, then run `just demo-input` in another terminal.
# Opt into initial processing for existing demo inputs and demo-test's startup seed.
settle: 200ms
concurrency: 2
state: ./demo/state

roots:
  - id: demo
    path: ./demo/work
    rules:
      # hello.txt -> hello.upper.txt
      - id: uppercase
        events: [startup, created, updated]
        match: '^(?P<name>[^/.]+)\.txt$'
        run: tr '[:lower:]' '[:upper:]' < "$FILE" > "${MATCH_NAME}.upper.txt"

      # hello.upper.txt -> hello.done.txt
      - id: finish
        events: [startup, created, updated]
        match: '^(?P<name>[^/.]+)\.upper\.txt$'
        run:
          - |
            {
              printf 'Processed: %s\n' "$KEY"
              cat "$FILE"
            } > "${MATCH_NAME}.done.txt"
          - 'printf "Finished: %s\n" "${MATCH_NAME}.done.txt"'

      # Also matches hello.txt; runs independently with no output file.
      - id: observe
        events: [startup, created, updated]
        match: '^(?P<name>[^/.]+)\.txt$'
        run: 'printf "Observed: %s\n" "$KEY"'
