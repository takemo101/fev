[package]
name = "fev"
version = "0.1.0"
edition = "2024"
description = "Native file-event command runner"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
humantime = "2"
libc = "0.2"
notify = "8"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "0.0.27"
tempfile = "3"
walkdir = "2"
