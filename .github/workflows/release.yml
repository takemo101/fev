name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          staging="dist/fev-${{ matrix.target }}"
          mkdir -p "$staging"
          install -m 755 "target/${{ matrix.target }}/release/fev" "$staging/fev"
          tar -C "$staging" -czf "dist/fev-${{ matrix.target }}.tar.gz" fev

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fev-${{ matrix.target }}
          path: dist/fev-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  build-linux:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          staging="dist/fev-${{ matrix.target }}"
          mkdir -p "$staging"
          install -m 755 "target/${{ matrix.target }}/release/fev" "$staging/fev"
          tar -C "$staging" -czf "dist/fev-${{ matrix.target }}.tar.gz" fev

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fev-${{ matrix.target }}
          path: dist/fev-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: publish release assets
    needs:
      - build-macos
      - build-linux
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: fev-*
          merge-multiple: true

      - name: Generate complete checksums
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum \
            fev-aarch64-apple-darwin.tar.gz \
            fev-x86_64-apple-darwin.tar.gz \
            fev-x86_64-unknown-linux-musl.tar.gz \
            fev-aarch64-unknown-linux-musl.tar.gz > checksums.txt
          cat checksums.txt

      - name: Publish archives and checksums
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
